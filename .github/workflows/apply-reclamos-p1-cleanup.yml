name: Apply Reclamos P1 Cleanup

on:
  push:
    branches:
      - fix/reclamos-prestacionales-p1-cleanup
    paths:
      - 'scripts/reclamos/aplicar_limpieza_p1.py'
      - '.github/workflows/apply-reclamos-p1-cleanup.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.event_name == 'push' || github.head_ref == 'fix/reclamos-prestacionales-p1-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/reclamos-prestacionales-p1-cleanup
          fetch-depth: 0

      - name: Detect current state
        id: state
        shell: bash
        run: |
          if grep -q 'BAJAS_RECIENTES' \
              ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamosPrestacionesServiceUtil.java; then
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          else
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply deterministic transformation
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set +e
          python3 scripts/reclamos/aplicar_limpieza_p1.py > reclamos-p1-diagnostic.log 2>&1
          status=$?
          cat reclamos-p1-diagnostic.log
          exit $status

      - name: Upload transformation diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reclamos-p1-diagnostic
          path: reclamos-p1-diagnostic.log
          if-no-files-found: error
          retention-days: 1

      - name: Validate repaired invariants
        run: |
          ! grep -q 'BAJAS_RECIENTES' \
            ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamosPrestacionesServiceUtil.java
          ! grep -q 'esBajaReciente' \
            ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamosPrestacionesServiceUtil.java
          grep -q 'HtmlUtil.escapeJS' \
            ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/datos_edicion_prestacion.jsp
          grep -q 'ReclamoPrestacionalBajaTransaccionalService.borrar' \
            ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamosPrestacionesServiceUtil.java
          python3 - <<'PY'
          from pathlib import Path

          def read_legacy(path):
              raw = Path(path).read_bytes()
              try:
                  return raw.decode('utf-8')
              except UnicodeDecodeError:
                  return raw.decode('iso-8859-1')

          action = read_legacy('ext-impl/src/ar/com/ospim/autorizaciones/action/EditarReclamosEntryAction.java')
          start_marker = '\t\t\tif(cmd.equals(Constants.DELETE))'
          end_marker = '\t\t\t\t  BusquedaReclamosPrestacionalesFiltro filtro = null ;'
          start = action.index(start_marker)
          end = action.index(end_marker, start)
          delete_block = action[start:end]
          assert 'ClienteAppMobile' not in delete_block
          assert 'getReclamoPrestacional(idReclamoDeBuscador)' not in delete_block
          assert 'ClienteAppMobile.actualizarEstadoReintegro(idExterno, codigoExterno, token)' in action

          editor = read_legacy('ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/datos_edicion_prestacion.jsp')
          assert 'if (prestacionEnEdicion != null) {\n%>\n\n<script' not in editor
          assert editor.count('jQuery("#<portlet:namespace />idRegistro").val') == 0
          print('RECLAMOS_P1_INVARIANTS_OK')
          PY

      - name: Package validated files
        if: steps.state.outputs.applied != 'true'
        run: |
          mkdir -p reclamos-p1-transformed
          cp --parents \
            ext-impl/src/ar/com/ospim/autorizaciones/action/EditarReclamosEntryAction.java \
            ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamosPrestacionesServiceUtil.java \
            ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/datos_edicion_prestacion.jsp \
            reclamos-p1-transformed/

      - name: Upload validated files
        if: steps.state.outputs.applied != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reclamos-p1-transformed
          path: reclamos-p1-transformed
          if-no-files-found: error
          retention-days: 1

      - name: Commit repaired files
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set +e
          {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              ext-impl/src/ar/com/ospim/autorizaciones/action/EditarReclamosEntryAction.java \
              ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamosPrestacionesServiceUtil.java \
              ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/datos_edicion_prestacion.jsp
            git commit -m 'fix(reclamos): elimina duplicidad móvil y repara editor'
            git push origin HEAD:fix/reclamos-prestacionales-p1-cleanup
          } > reclamos-p1-publish.log 2>&1
          status=$?
          cat reclamos-p1-publish.log
          exit $status

      - name: Upload publication diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reclamos-p1-publish-diagnostic
          path: reclamos-p1-publish.log
          if-no-files-found: ignore
          retention-days: 1
