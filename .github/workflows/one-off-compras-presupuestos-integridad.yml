name: One-off Compras presupuestos integridad

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: one-off-compras-presupuestos-integridad
  cancel-in-progress: false

jobs:
  aplicar:
    if: github.event.issue.title == '[one-off] aplicar integridad presupuestos compras'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: molineros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Configure Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Apply, validate and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          LOG=/tmp/compras-one-off.log
          touch "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          report_failure() {
            rc=$?
            set +e
            tail -n 120 "$LOG" > /tmp/compras-one-off-tail.log
            body="La publicación directa en main falló (exit $rc). Últimas líneas:\n\n\`\`\`text\n$(cat /tmp/compras-one-off-tail.log)\n\`\`\`"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="$body" >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap report_failure ERR

          EXPECTED_BASE=e17dcc5a0f90f77af498d850bf12d21438438d63
          WORKFLOW=.github/workflows/one-off-compras-presupuestos-integridad.yml
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW"

          PAYLOAD_ISSUE=37
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PAYLOAD_ISSUE}/comments?per_page=100" \
            --jq '.[] | select(.body | startswith("PAYLOAD-")) | ((.body | split("\n")[0]) + "\t" + (.body | split("\n")[1]))' \
            | LC_ALL=C sort > /tmp/compras-payload.parts
          test "$(wc -l < /tmp/compras-payload.parts | tr -d ' ')" = "2"
          awk -F '\t' '{printf "%s", $2}' /tmp/compras-payload.parts \
            | base64 -d > /tmp/compras-payload.tgz
          mkdir -p /tmp/compras-payload
          tar -xzf /tmp/compras-payload.tgz -C /tmp/compras-payload
          cp /tmp/compras-payload/apply_compras_presupuestos.py /tmp/
          cp /tmp/compras-payload/compras_migration_baseline.sql /tmp/
          cp /tmp/compras-payload/compras_external_stubs.sql /tmp/
          cat > /tmp/compras-payload.sha256 <<'PAYLOAD_SHA'
          b5e250876bca938c134c64dd7784cd1982fbcdf6bad90f4b9918fc98fc4cd85  /tmp/apply_compras_presupuestos.py
          50db45e0a52f0149979559facc4144041a375ac576d02f148c1fc32512563680  /tmp/compras_migration_baseline.sql
          286dc3e82ef843222c5f242c269981707e894ee9db999f489fec87176aebe551  /tmp/compras_external_stubs.sql
          PAYLOAD_SHA
          sha256sum -c /tmp/compras-payload.sha256

          python3 -m py_compile /tmp/apply_compras_presupuestos.py
          python3 /tmp/apply_compras_presupuestos.py
          git diff --check

          python3 - <<'PY_VALIDATE'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          sql_paths = [
              Path('ext-impl/src/ar/com/ospim/compras/sql/compras_schema.sql'),
              Path('ext-impl/src/ar/com/ospim/compras/sql/20260721_presupuesto_activo_prestador.sql'),
          ]
          for path in sql_paths:
              text = path.read_bytes().decode('utf-8', 'strict')
              assert '\\set ' not in text, path
              assert '\\encoding' not in text, path
              assert '\ufffd' not in text, path
              assert 'BEGIN;' in text and 'COMMIT;' in text, path

          changed = [Path(p) for p in '''
          ext-impl/src/ar/com/ospim/compras/sql/20260721_presupuesto_activo_prestador.sql
          ext-impl/src/ar/com/ospim/compras/sql/compras_schema.sql
          ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceUtil.java
          ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceImpl.java
          ext-impl/src/ar/com/ospim/compras/requerimientos/service/EditarRequerimientoCompraServiceImpl.java
          ext-impl/src/ar/com/ospim/compras/requerimientos/util/RequerimientoCompraPdfFormatter.java
          ext-impl/src/ar/com/ospim/test/ComprasPresupuestoPrestadorContractTest.java
          ext-impl/src/ar/com/ospim/test/ComprasPresupuestoAdjudicableContractTest.java
          ext-web/docroot/html/portlet/compras/requerimientos/partials/_detalle_modelo.jsp
          ext-web/docroot/html/portlet/compras/requerimientos/partials/_detalle_tabla.jsp
          ext-web/docroot/html/portlet/compras/requerimientos/requerimiento_adjuntos.jsp
          ext-web/docroot/html/portlet/compras/requerimientos/requerimiento_adjuntos_search_documentos.jsp
          ext-web/docroot/WEB-INF/classes/jasper/compras/requerimiento_compra.jrxml
          docs/compras/evidencias/compras_presupuesto_prestador_test.sql
          docs/compras/PRESUPUESTOS_REQUERIMIENTO_COMPRA.md
          '''.split()]
          for path in changed:
              raw = path.read_bytes()
              assert b'\xef\xbf\xbd' not in raw, path

          for path in [
              Path('ext-web/docroot/html/portlet/compras/requerimientos/partials/_detalle_modelo.jsp'),
              Path('ext-web/docroot/html/portlet/compras/requerimientos/partials/_detalle_tabla.jsp'),
              Path('ext-web/docroot/html/portlet/compras/requerimientos/requerimiento_adjuntos.jsp'),
              Path('ext-web/docroot/html/portlet/compras/requerimientos/requerimiento_adjuntos_search_documentos.jsp'),
          ]:
              raw = path.read_bytes()
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  text = raw.decode('latin-1')
              assert text.count('<%') == text.count('%>'), path

          ET.parse('ext-web/docroot/WEB-INF/classes/jasper/compras/requerimiento_compra.jrxml')

          struts_raw = Path('ext-web/docroot/WEB-INF/struts-config.xml').read_bytes()
          try:
              struts = struts_raw.decode('utf-8')
          except UnicodeDecodeError:
              struts = struts_raw.decode('latin-1')
          assert 'UploadPresupuestosComprasAction' in struts
          assert 'EditarRequerimientoCompraAction' in struts
          print('VALIDACION_ESTRUCTURAL_COMPRAS_OK')
          PY_VALIDATE

          sudo apt-get update -qq
          sudo apt-get install -y -qq ant postgresql-client

          createdb -h 127.0.0.1 -U postgres molineros_schema_test
          psql -X -h 127.0.0.1 -U postgres -d molineros_schema_test \
            -v ON_ERROR_STOP=1 -f /tmp/compras_external_stubs.sql
          psql -X -h 127.0.0.1 -U postgres -d molineros_schema_test \
            -v ON_ERROR_STOP=1 \
            -f ext-impl/src/ar/com/ospim/compras/sql/compras_schema.sql \
            | tee /tmp/compras-schema.log

          psql -X -h 127.0.0.1 -U postgres -d molineros_test \
            -v ON_ERROR_STOP=1 -f /tmp/compras_migration_baseline.sql
          psql -X -h 127.0.0.1 -U postgres -d molineros_test \
            -v ON_ERROR_STOP=1 \
            -f ext-impl/src/ar/com/ospim/compras/sql/20260721_presupuesto_activo_prestador.sql \
            | tee /tmp/compras-migration.log
          psql -X -h 127.0.0.1 -U postgres -d molineros_test \
            -v ON_ERROR_STOP=1 \
            -f docs/compras/evidencias/compras_presupuesto_prestador_test.sql \
            | tee /tmp/compras-evidence.log
          grep -q CONTRATO_COMPRAS_PRESUPUESTO_POSTGRESQL_OK /tmp/compras-evidence.log

          export ANT_OPTS='-Xms256m -Xmx1024m'
          ant -Djavac.compiler=modern -Djavac.fork=true \
            -f ext-impl/build.xml clean compile | tee /tmp/ant-ext-impl.log
          ant -Djavac.compiler=modern -Djavac.fork=true \
            -f ext-web/build.xml clean compile | tee /tmp/ant-ext-web.log

          CP=$(python3 - <<'PY_CP'
          from pathlib import Path
          paths = [Path('ext-impl/classes'), Path('ext-service/classes')]
          for root in ('ext-lib', 'lib', 'modules'):
              base = Path(root)
              if base.exists():
                  paths.extend(sorted(base.rglob('*.jar')))
          print(':'.join(str(path) for path in paths))
          PY_CP
          )

          java -cp "$CP" ar.com.ospim.test.ComprasPresupuestoPrestadorContractTest
          java -cp "$CP" ar.com.ospim.test.ComprasRequerimientosUiContractTest
          java -cp "$CP" ar.com.ospim.test.ComprasPresupuestoAdjudicableContractTest
          java -cp "$CP" ar.com.ospim.test.UploadPresupuestosComprasActionTest
          java -cp "$CP" ar.com.ospim.test.EditarRequerimientoCompraActionTest

          ant -Djavac.compiler=modern -f ext-impl/build.xml clean
          ant -Djavac.compiler=modern -f ext-web/build.xml clean

          rm -f "$WORKFLOW"

          python3 - <<'PY_SCOPE'
          import subprocess
          expected = set('''
          .github/workflows/one-off-compras-presupuestos-integridad.yml
          ext-impl/src/ar/com/ospim/compras/sql/20260721_presupuesto_activo_prestador.sql
          ext-impl/src/ar/com/ospim/compras/sql/compras_schema.sql
          ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceUtil.java
          ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceImpl.java
          ext-impl/src/ar/com/ospim/compras/requerimientos/service/EditarRequerimientoCompraServiceImpl.java
          ext-impl/src/ar/com/ospim/compras/requerimientos/util/RequerimientoCompraPdfFormatter.java
          ext-impl/src/ar/com/ospim/test/ComprasPresupuestoPrestadorContractTest.java
          ext-impl/src/ar/com/ospim/test/ComprasPresupuestoAdjudicableContractTest.java
          ext-web/docroot/html/portlet/compras/requerimientos/partials/_detalle_modelo.jsp
          ext-web/docroot/html/portlet/compras/requerimientos/partials/_detalle_tabla.jsp
          ext-web/docroot/html/portlet/compras/requerimientos/requerimiento_adjuntos.jsp
          ext-web/docroot/html/portlet/compras/requerimientos/requerimiento_adjuntos_search_documentos.jsp
          ext-web/docroot/WEB-INF/classes/jasper/compras/requerimiento_compra.jrxml
          docs/compras/evidencias/compras_presupuesto_prestador_test.sql
          docs/compras/PRESUPUESTOS_REQUERIMIENTO_COMPRA.md
          '''.split())
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD'], text=True
          ).split())
          if actual != expected:
              raise SystemExit('Unexpected scope. Missing=%s Extra=%s' % (
                  sorted(expected - actual), sorted(actual - expected)
              ))
          print('ALCANCE_COMPRAS_OK')
          PY_SCOPE

          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(compras): unifica presupuestos adjudicables'
          FINAL_SHA=$(git rev-parse HEAD)
          git push origin HEAD:main
          test -z "$(git status --porcelain)"

          trap - ERR
          body="Publicación completada en main.\n\nCommit final: \`${FINAL_SHA}\`\n\nValidaciones: esquema canónico y migración en PostgreSQL 9.6, escenarios A-D, compilación Ant ext-impl/ext-web, contratos Java, Jasper XML, JSP/Struts, codificación y alcance."
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$body" >/dev/null 2>&1 || true
