name: TEMP Generate Reclamo View Segments

on:
  push:
    branches:
      - agent/segmenta-view-reclamos-prestacionales
    paths:
      - 'scripts/reclamos/generar_segmentos_view_reclamo.py'
      - '.github/workflows/tmp-generar-segmentos-view-reclamo.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate byte-preserving fragments
        run: python3 scripts/reclamos/generar_segmentos_view_reclamo.py

      - name: Validate generated diff
        run: |
          git diff --check
          test "$(git diff --name-only | grep -c '^ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo')" -eq 9

      - name: Commit generated fragments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.jspf
          git add ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_*.jspf
          git commit -m "refactor(reclamos): genera segmentos exactos del view"
          git push
