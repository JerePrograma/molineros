name: One-off Compras presupuestos integridad v2

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: one-off-compras-presupuestos-integridad-v2
  cancel-in-progress: false

jobs:
  aplicar:
    if: github.event.issue.title == '[one-off-v2] aplicar integridad presupuestos compras'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: molineros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Execute verified one-off runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          PAYLOAD_ISSUE=37
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PAYLOAD_ISSUE}/comments?per_page=100" \
            --jq '.[] | select(.body | startswith("RUNNER-00")) | (.body | split("\n")[1])' \
            > /tmp/compras-runner.b64
          test "$(wc -l < /tmp/compras-runner.b64 | tr -d ' ')" = "1"
          tr -d '\n\r' < /tmp/compras-runner.b64 \
            | base64 -d \
            | gzip -d > /tmp/compras-runner.sh
          test "$(sha256sum /tmp/compras-runner.sh | cut -d' ' -f1)" = \
            074f302aea801b66afcb84e16ffa25f3b46c768de53c2c33d7dd21543c8c19e6
          chmod 700 /tmp/compras-runner.sh
          /tmp/compras-runner.sh
