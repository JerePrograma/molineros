name: One-off Compras estado real por prestador

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-off-compras-presupuesto-estado-real.yml
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: one-off-compras-presupuesto-estado-real
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Implementar presupuesto único y estado COTIZADO
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip -dc > /tmp/patch_compras.py
          python3 -m py_compile /tmp/patch_compras.py
          python3 /tmp/patch_compras.py

      - name: Validar implementación
        shell: bash
        run: |
          git diff --check
          rm -rf /tmp/compras-presupuesto-contract
          mkdir -p /tmp/compras-presupuesto-contract
          javac -encoding UTF-8 \
            -d /tmp/compras-presupuesto-contract \
            ext-impl/src/ar/com/ospim/test/ComprasPresupuestoPrestadorContractTest.java
          java -cp /tmp/compras-presupuesto-contract \
            ar.com.ospim.test.ComprasPresupuestoPrestadorContractTest

      - name: Publicar en main
        shell: bash
        run: |
          rm -f .github/workflows/one-off-compras-presupuesto-estado-real.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No se generaron cambios para publicar."
            exit 1
          fi
          git commit -m "fix(compras): cotiza prestador al cargar presupuesto"
          git push origin HEAD:main
