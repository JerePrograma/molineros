name: Restore Reclamos P1 Editor Preamble

on:
  push:
    branches:
      - fix/reclamos-prestacionales-p1-cleanup
    paths:
      - 'scripts/reclamos/restaurar_preambulo_editor_p1.py'
      - '.github/workflows/restore-reclamos-p1-editor-preamble.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/reclamos-prestacionales-p1-cleanup
          fetch-depth: 0

      - name: Restore preamble
        run: python3 scripts/reclamos/restaurar_preambulo_editor_p1.py

      - name: Validate preamble and repaired script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/datos_edicion_prestacion.jsp').read_bytes()
          try:
              text = raw.decode('utf-8')
          except UnicodeDecodeError:
              text = raw.decode('iso-8859-1')
          required = [
              'tipoedicion = (Integer) request.getAttribute("tipoEdicion")',
              'fechaseccional.setTime(prestacionEnEdicion.getComprobanteFecha())',
              'fechaPrestacion.setTime(prestacionEnEdicion.getFechaPrestacion())',
              'captionbotoncancelar="Cancelar Edicion de la Prestacion"',
              'captionlabelproceso="PRESTACION EN PROCESO DE EDICION"',
              'ocultarSeccional = (String) request.getAttribute("ocultar")',
              'HtmlUtil.escapeJS(codigoPrestacionEdicion)',
          ]
          for value in required:
              assert value in text, value
          assert 'if (prestacionEnEdicion != null) {\n%>\n\n<script' not in text
          print('RECLAMOS_P1_EDITOR_PREAMBLE_OK')
          PY

      - name: Commit restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/datos_edicion_prestacion.jsp
          git commit -m 'fix(reclamos): restaura preámbulo funcional del editor'
          git push origin HEAD:fix/reclamos-prestacionales-p1-cleanup
