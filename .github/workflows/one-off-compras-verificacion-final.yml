name: One-off Compras verificacion final

on:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  verify:
    if: github.event.issue.title == '[one-off] verificar presupuesto prestador final'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compilar y ejecutar contrato
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm -rf /tmp/compras-presupuesto-contract
          mkdir -p /tmp/compras-presupuesto-contract
          javac -encoding UTF-8 -d /tmp/compras-presupuesto-contract \
            ext-impl/src/ar/com/ospim/test/ComprasPresupuestoPrestadorContractTest.java
          java -cp /tmp/compras-presupuesto-contract \
            ar.com.ospim.test.ComprasPresupuestoPrestadorContractTest
          test ! -e ext-impl/src/ar/com/ospim/compras/requerimientos/beans/PrestadorCotizacionConPresupuesto.java
          test ! -e .github/one-off/patch_compras.b64
          test ! -e .github/diagnostics/one-off-compras-presupuesto-error.txt

      - name: Retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-off-compras-verificacion-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: retira verificación temporal de compras"
          git push origin HEAD:main
