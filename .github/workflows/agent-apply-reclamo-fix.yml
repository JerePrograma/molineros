name: Agent Apply Reclamo Fix

on:
  push:
    branches:
      - agent/fix-reintegro-farmacia-editor-jsp

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-reintegro-farmacia-editor-jsp
          fetch-depth: 0

      - name: Apply byte-preserving fix
        run: python3 scripts/reclamos/aplicar_fix_reintegro_farmacia_editor.py

      - name: Commit functional changes
        run: |
          if git diff --quiet; then
            echo "No functional changes pending"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/datos_edicion_prestacion.jsp \
            ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_initial_state.js \
            ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_cabecera.jspf \
            ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.jsp
          git commit -m "fix(reclamos): repara editor JSP y selector farmacia"
          git push origin HEAD:agent/fix-reintegro-farmacia-editor-jsp
