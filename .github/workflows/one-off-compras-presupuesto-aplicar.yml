name: One-off Compras aplicar presupuesto

on:
  issues:
    types:
      - opened

permissions:
  contents: write

concurrency:
  group: one-off-compras-presupuesto-aplicar
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.title == '[one-off] publicar presupuesto prestador validado'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar y validar
        shell: bash
        run: |
          set -euo pipefail
          echo '2c47a3ba88b9fa7a997329117c330e27512e810efe1674f828898bbbc9bb6f9a  .github/one-off/patch_compras.b64' | sha256sum -c -
          base64 --decode .github/one-off/patch_compras.b64 | gzip -dc > /tmp/patch_compras.py
          echo '32a36031cf32772b5c026dd1b95f3c7b2ec7a047dc413f6568dd1e380f5b9fe0  /tmp/patch_compras.py' | sha256sum -c -
          python3 -m py_compile /tmp/patch_compras.py
          python3 /tmp/patch_compras.py
          git diff --check
          rm -rf /tmp/compras-presupuesto-contract
          mkdir -p /tmp/compras-presupuesto-contract
          javac -encoding UTF-8 -d /tmp/compras-presupuesto-contract \
            ext-impl/src/ar/com/ospim/test/ComprasPresupuestoPrestadorContractTest.java
          java -cp /tmp/compras-presupuesto-contract \
            ar.com.ospim.test.ComprasPresupuestoPrestadorContractTest

      - name: Publicar en main y limpiar auxiliares
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-off-compras-presupuesto-aplicar.yml
          rm -f .github/one-off/patch_compras.b64
          rm -f .github/diagnostics/one-off-compras-presupuesto-error.txt
          rmdir .github/one-off 2>/dev/null || true
          rmdir .github/diagnostics 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No se generaron cambios para publicar.'
            exit 1
          fi
          git commit -m "fix(compras): cotiza prestador al cargar presupuesto"
          git push origin HEAD:main
