          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: se esperó 1 coincidencia y se encontraron {count}")
              return text.replace(old, new, 1)

          schema_path = Path("ext-impl/src/ar/com/ospim/compras/sql/compras_schema.sql")
          action_path = Path("ext-impl/src/ar/com/ospim/compras/requerimientos/action/UploadPresupuestosComprasAction.java")
