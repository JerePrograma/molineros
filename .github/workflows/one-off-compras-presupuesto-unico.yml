    protected void validarUnPresupuestoPorPrestador(
            int idRequerimientoCompra,
            List<PresupuestoEntrada> entradas) throws Exception {

        if (idRequerimientoCompra <= 0) {
            throw new Exception("El requerimiento de compra no es válido.");
        }

        if (entradas == null || entradas.isEmpty()) {
            return;
        }

        Set<Integer> prestadoresSeleccionados =
                new HashSet<Integer>();

        for (int i = 0; i < entradas.size(); i++) {
            PresupuestoEntrada entrada = entradas.get(i);

            if (entrada == null || entrada.idPrestador <= 0) {
                continue;
            }

            Integer idPrestador =
                    Integer.valueOf(entrada.idPrestador);

            if (!prestadoresSeleccionados.add(idPrestador)) {
                throw new Exception(
                        "El prestador del presupuesto "
                                + (i + 1)
                                + " está repetido. Sólo puede cargarse "
                                + "un archivo por prestador."
                );
            }
        }

        if (prestadoresSeleccionados.isEmpty()) {
            return;
        }

        List<RequerimientoCompraPresupuesto> existentes =
                BusquedaRequerimientoCompraServiceUtil
                        .listarPresupuestos(idRequerimientoCompra);

        for (int i = 0;
                existentes != null && i < existentes.size();
                i++) {

            RequerimientoCompraPresupuesto existente =
                    existentes.get(i);

            if (existente == null
                    || !existente.isActivo()
                    || existente.getIdPrestador() == null) {

                continue;
            }

            Integer idPrestadorExistente =
                    existente.getIdPrestador();

            if (prestadoresSeleccionados.contains(
                    idPrestadorExistente
            )) {
                throw new Exception(
                        "El prestador seleccionado ya tiene un presupuesto "
                                + "cargado para este requerimiento. Debe "
                                + "eliminarlo antes de cargar otro archivo."
                );
            }
        }
    }

