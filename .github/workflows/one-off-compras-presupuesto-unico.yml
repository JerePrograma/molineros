name: One-off Compras presupuesto único por prestador

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-off-compras-presupuesto-unico.yml

permissions:
  contents: write

concurrency:
  group: one-off-compras-presupuesto-unico
  cancel-in-progress: false

