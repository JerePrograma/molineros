name: Reclamo Operational Scripts

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/reclamos/**'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalEditorContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalInitialViewContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalLegacyFlowContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalJspStructureContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalPrestacionRulesContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalCompraPrecargaContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamosBaseActionLegacyDiagnosticTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ComprasRequerimientoConnectionContractTest.java'
      - 'ext-impl/src/ar/com/ospim/autorizaciones/action/EditarPrestacionReclamoAction.java'
      - 'ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceUtil.java'
      - 'ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraLecturaSeguraServiceImpl.java'
      - 'ext-impl/src/ar/com/ospim/compras/requerimientos/service/ReclamoPrestacionalCompraPrecargaServiceUtil.java'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/datos_edicion_prestacion.jsp'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_p0_patch.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_editor_patch.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_prestacion_rules_patch.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_tab_guard.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_cabecera.jspf'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_recuperable_neutro.jspf'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.jspf'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.jsp'
      - '.github/workflows/reclamos-operational-scripts.yml'
  pull_request:
    paths:
      - 'scripts/reclamos/**'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalEditorContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalInitialViewContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalLegacyFlowContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalJspStructureContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalPrestacionRulesContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalCompraPrecargaContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamosBaseActionLegacyDiagnosticTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ComprasRequerimientoConnectionContractTest.java'
      - 'ext-impl/src/ar/com/ospim/autorizaciones/action/EditarPrestacionReclamoAction.java'
      - 'ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceUtil.java'
      - 'ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraLecturaSeguraServiceImpl.java'
      - 'ext-impl/src/ar/com/ospim/compras/requerimientos/service/ReclamoPrestacionalCompraPrecargaServiceUtil.java'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/datos_edicion_prestacion.jsp'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_p0_patch.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_editor_patch.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_prestacion_rules_patch.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_tab_guard.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_cabecera.jspf'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_recuperable_neutro.jspf'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.jspf'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.jsp'
      - '.github/workflows/reclamos-operational-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell and Python syntax
        run: |
          bash -n scripts/reclamos/validar_release_reclamos.sh
          bash -n scripts/reclamos/verificar_outbox_appmobile.sh
          python3 -m py_compile scripts/reclamos/verificar_reclamo_editor_jsp.py

      - name: Validate Reclamo Prestacional editor
        run: |
          python3 scripts/reclamos/verificar_reclamo_editor_jsp.py
          node --check ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.js
          node --check ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_p0_patch.js
          node --check ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_editor_patch.js
          node --check ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_prestacion_rules_patch.js
          node --check ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_tab_guard.js

      - name: Run focused Java contracts
        run: |
          CONTRACT_DIR="$RUNNER_TEMP/reclamo-editor-contracts"
          mkdir -p "$CONTRACT_DIR"
          javac -encoding UTF-8 -d "$CONTRACT_DIR" \
            ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalEditorContractTest.java \
            ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalInitialViewContractTest.java \
            ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalLegacyFlowContractTest.java \
            ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalJspStructureContractTest.java \
            ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalPrestacionRulesContractTest.java \
            ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalCompraPrecargaContractTest.java \
            ext-impl/src/ar/com/ospim/test/ReclamosBaseActionLegacyDiagnosticTest.java \
            ext-impl/src/ar/com/ospim/test/ComprasRequerimientoConnectionContractTest.java
          java -cp "$CONTRACT_DIR" ar.com.ospim.test.ReclamoPrestacionalEditorContractTest
          java -cp "$CONTRACT_DIR" ar.com.ospim.test.ReclamoPrestacionalInitialViewContractTest
          java -cp "$CONTRACT_DIR" ar.com.ospim.test.ReclamoPrestacionalLegacyFlowContractTest
          java -cp "$CONTRACT_DIR" ar.com.ospim.test.ReclamoPrestacionalJspStructureContractTest
          java -cp "$CONTRACT_DIR" ar.com.ospim.test.ReclamoPrestacionalPrestacionRulesContractTest
          java -cp "$CONTRACT_DIR" ar.com.ospim.test.ReclamoPrestacionalCompraPrecargaContractTest
          java -cp "$CONTRACT_DIR" ar.com.ospim.test.ComprasRequerimientoConnectionContractTest

      - name: Diagnose pre-existing ReclamosBaseAction debt
        continue-on-error: true
        run: |
          CONTRACT_DIR="$RUNNER_TEMP/reclamo-editor-contracts"
          java -cp "$CONTRACT_DIR" ar.com.ospim.test.ReclamosBaseActionLegacyDiagnosticTest

      - name: Validate release gate help files
        run: |
          test -f scripts/reclamos/README.md
          grep -q 'ALLOW_LEGACY_APPMOBILE_SECRETS' scripts/reclamos/README.md
          grep -q 'PENDING_MAX_MINUTES' scripts/reclamos/verificar_outbox_appmobile.sh
          grep -q 'MAX_ATTEMPTS' scripts/reclamos/verificar_outbox_appmobile.sh
