name: Apply AppMobile Secret Cleanup

on:
  push:
    branches:
      - fix/appmobile-retira-secretos-legacy
    paths:
      - 'scripts/reclamos/retirar_secretos_cliente_appmobile.py'
      - '.github/workflows/apply-appmobile-secret-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/appmobile-retira-secretos-legacy
          fetch-depth: 0

      - name: Remove embedded credentials
        run: python3 scripts/reclamos/retirar_secretos_cliente_appmobile.py

      - name: Verify secret scanner
        run: bash scripts/reclamos/verificar_secretos_appmobile.sh

      - name: Validate secure delegation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ext-impl/src/ar/com/ospim/desarrolloAppMobile/beans/ClienteAppMobile.java')
          raw = path.read_bytes()
          try:
              text = raw.decode('utf-8')
          except UnicodeDecodeError:
              text = raw.decode('iso-8859-1')
          assert 'return ReclamoAppMobileAuthClient.obtenerToken();' in text
          assert 'private static final String API_KEY' not in text
          assert 'private static final String EMAIL' not in text
          assert 'private static final String PASSWORD' not in text
          assert 'private static final String LOGIN_URL' not in text
          print('CLIENTE_APPMOBILE_SECURE_DELEGATION_OK')
          PY

      - name: Commit repaired client
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ext-impl/src/ar/com/ospim/desarrolloAppMobile/beans/ClienteAppMobile.java
          git commit -m 'fix(seguridad): retira credenciales AppMobile embebidas'
          git pull --rebase origin fix/appmobile-retira-secretos-legacy
          git push origin HEAD:fix/appmobile-retira-secretos-legacy
