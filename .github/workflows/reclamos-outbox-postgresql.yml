name: Reclamo Outbox PostgreSQL

on:
  push:
    branches:
      - main
    paths:
      - 'sql/postgresql/autorizaciones/reclamo_appmobile_outbox*.sql'
      - 'scripts/reclamos/aplicar_outbox_appmobile.sh'
      - 'scripts/reclamos/verificar_outbox_appmobile.sh'
      - '.github/workflows/reclamos-outbox-postgresql.yml'
  pull_request:
    paths:
      - 'sql/postgresql/autorizaciones/reclamo_appmobile_outbox*.sql'
      - 'scripts/reclamos/aplicar_outbox_appmobile.sh'
      - 'scripts/reclamos/verificar_outbox_appmobile.sh'
      - '.github/workflows/reclamos-outbox-postgresql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: molineros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d molineros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: molineros_test
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate shell syntax
        run: |
          bash -n scripts/reclamos/aplicar_outbox_appmobile.sh
          bash -n scripts/reclamos/verificar_outbox_appmobile.sh

      - name: Prepare legacy schema
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -c 'CREATE SCHEMA IF NOT EXISTS autorizaciones;'

      - name: Run preflight before migration
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f sql/postgresql/autorizaciones/reclamo_appmobile_outbox_preflight.sql

      - name: Apply migration twice
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f sql/postgresql/autorizaciones/reclamo_appmobile_outbox.sql
          psql -X -v ON_ERROR_STOP=1 \
            -f sql/postgresql/autorizaciones/reclamo_appmobile_outbox.sql

      - name: Run post-migration preflight
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f sql/postgresql/autorizaciones/reclamo_appmobile_outbox_preflight.sql

      - name: Validate healthy empty outbox
        run: |
          bash scripts/reclamos/verificar_outbox_appmobile.sh

      - name: Validate overdue warning
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO autorizaciones.reclamo_appmobile_outbox (
              id_reclamo,
              id_reintegro_app,
              estado_destino,
              estado_proceso,
              intentos,
              proximo_intento,
              ultimo_error
          ) VALUES (
              10,
              100,
              'AN',
              'PENDIENTE',
              1,
              NOW() - INTERVAL '20 minutes',
              'TEST_OVERDUE'
          );
          SQL

          set +e
          PENDING_MAX_MINUTES=10 \
            bash scripts/reclamos/verificar_outbox_appmobile.sh
          status=$?
          set -e
          test "$status" -eq 1

      - name: Validate partial unique index
        run: |
          set +e
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO autorizaciones.reclamo_appmobile_outbox (
              id_reclamo,
              id_reintegro_app,
              estado_destino,
              estado_proceso,
              intentos,
              proximo_intento
          ) VALUES (
              11,
              100,
              'AN',
              'PENDIENTE',
              0,
              NOW()
          );
          SQL
          status=$?
          set -e
          test "$status" -ne 0

      - name: Validate guarded applicator
        run: |
          set +e
          bash scripts/reclamos/aplicar_outbox_appmobile.sh --apply
          status=$?
          set -e
          test "$status" -eq 2

          CONFIRM_OUTBOX_MIGRATION=YES \
            bash scripts/reclamos/aplicar_outbox_appmobile.sh --apply
