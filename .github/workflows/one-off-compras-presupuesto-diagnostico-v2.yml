name: One-off Compras diagnostico presupuesto v2

on:
  issues:
    types:
      - opened

permissions:
  contents: write

concurrency:
  group: one-off-compras-presupuesto-diagnostico-v2
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.issue.title == '[one-off] ejecutar diagnostico presupuesto prestador v2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ejecutar ajuste y capturar resultado
        shell: bash
        run: |
          set +e
          {
            echo '2c47a3ba88b9fa7a997329117c330e27512e810efe1674f828898bbbc9bb6f9a  .github/one-off/patch_compras.b64' | sha256sum -c -
            base64 --decode .github/one-off/patch_compras.b64 | gzip -dc > /tmp/patch_compras.py
            echo '32a36031cf32772b5c026dd1b95f3c7b2ec7a047dc413f6568dd1e380f5b9fe0  /tmp/patch_compras.py' | sha256sum -c -
            python3 -m py_compile /tmp/patch_compras.py
            python3 /tmp/patch_compras.py
            git diff --check
            rm -rf /tmp/compras-presupuesto-contract
            mkdir -p /tmp/compras-presupuesto-contract
            javac -encoding UTF-8 -d /tmp/compras-presupuesto-contract \
              ext-impl/src/ar/com/ospim/test/ComprasPresupuestoPrestadorContractTest.java
            java -cp /tmp/compras-presupuesto-contract \
              ar.com.ospim.test.ComprasPresupuestoPrestadorContractTest
          } > /tmp/one-off-compras-diagnostico-v2.txt 2>&1
          status=$?
          set -e

          git reset --hard HEAD
          mkdir -p .github/diagnostics
          {
            echo "status=$status"
            cat /tmp/one-off-compras-diagnostico-v2.txt
          } > .github/diagnostics/one-off-compras-presupuesto-error.txt

      - name: Publicar diagnóstico y retirar workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-off-compras-presupuesto-diagnostico-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f .github/diagnostics/one-off-compras-presupuesto-error.txt
          git commit -m "chore: actualiza diagnóstico de presupuestos"
          git push origin HEAD:main
