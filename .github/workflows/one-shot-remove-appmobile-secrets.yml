name: One Shot Remove AppMobile Secrets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-remove-appmobile-secrets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace embedded credentials
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              'ext-impl/src/ar/com/ospim/desarrolloAppMobile/beans/'
              'ClienteAppMobile.java'
          )
          text = path.read_text(encoding='utf-8')
          replacements = {
              'private static final String API_KEY = "a7e0f120a2753b76d4b2fe5fa0f4dd90";':
                  'private static final String API_KEY = TraeListasServiceUtil.getSystemConfig("APP_BACKOFFICE_API_KEY");',
              'private static final String EMAIL = "integraciones@backoffice.com.ar";':
                  'private static final String EMAIL = TraeListasServiceUtil.getSystemConfig("APP_BACKOFFICE_EMAIL");',
              'private static final String PASSWORD = "mypassword";':
                  'private static final String PASSWORD = TraeListasServiceUtil.getSystemConfig("APP_BACKOFFICE_PASSWORD");'
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      'Patrón inesperado en ClienteAppMobile: %r, coincidencias=%s'
                      % (old.split(' = ')[0], count)
                  )
              text = text.replace(old, new, 1)

          forbidden = [
              'a7e0f120a2753b76d4b2fe5fa0f4dd90',
              'integraciones@backoffice.com.ar',
              '"mypassword"'
          ]
          for value in forbidden:
              if value in text:
                  raise SystemExit('Persistió una credencial literal')

          path.write_text(text, encoding='utf-8')

      - name: Verify configured credentials
        run: |
          grep -q 'APP_BACKOFFICE_API_KEY' ext-impl/src/ar/com/ospim/desarrolloAppMobile/beans/ClienteAppMobile.java
          grep -q 'APP_BACKOFFICE_EMAIL' ext-impl/src/ar/com/ospim/desarrolloAppMobile/beans/ClienteAppMobile.java
          grep -q 'APP_BACKOFFICE_PASSWORD' ext-impl/src/ar/com/ospim/desarrolloAppMobile/beans/ClienteAppMobile.java
          ! grep -q 'private static final String API_KEY = "' ext-impl/src/ar/com/ospim/desarrolloAppMobile/beans/ClienteAppMobile.java
          ! grep -q 'private static final String EMAIL = "' ext-impl/src/ar/com/ospim/desarrolloAppMobile/beans/ClienteAppMobile.java
          ! grep -q 'private static final String PASSWORD = "' ext-impl/src/ar/com/ospim/desarrolloAppMobile/beans/ClienteAppMobile.java

      - name: Commit security fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ext-impl/src/ar/com/ospim/desarrolloAppMobile/beans/ClienteAppMobile.java
          git commit -m 'fix(seguridad): retira credenciales AppMobile embebidas'
          git push origin HEAD:main
