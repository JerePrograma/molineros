      - 'ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamoAppMobileOutboxDispatcher.java'
      - 'ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamoPrestacionalBajaTransaccionalService.java'
      - 'ext-impl/src/ar/com/ospim/desarrolloAppMobile/beans/ClienteAppMobile.java'
      - 'ext-impl/src/ar/com/ospim/test/ClienteAppMobileLegacySecurityContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalP0ContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalP1CleanupContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalEditorContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalTabGuardContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoAppMobileSyncContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoAppMobileOutboxContractTest.java'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.jsp'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_p0_patch.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_editor_patch.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_tab_guard.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/datos_edicion_prestacion.jsp'
      - '.github/workflows/reclamo-prestacional-p0-contract.yml'
  pull_request:
    paths:
      - 'docs/autorizaciones/RECLAMOS_PRESTACIONALES_P0_DEPLOY.md'
      - 'docs/autorizaciones/RECLAMOS_PRESTACIONALES_P1_CLEANUP.md'
      - 'docs/autorizaciones/RECLAMOS_APPMOBILE_OUTBOX_OPERACION.md'
      - 'sql/postgresql/autorizaciones/reclamo_appmobile_outbox.sql'
      - 'scripts/reclamos/verificar_secretos_appmobile.sh'
      - 'scripts/reclamos/validar_release_reclamos.sh'
      - 'ext-impl/src/ar/com/ospim/autorizaciones/action/ReclamosBaseAction.java'
      - 'ext-impl/src/ar/com/ospim/autorizaciones/action/EditarReclamosEntryAction.java'
      - 'ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamosPrestacionesServiceUtil.java'
      - 'ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamoAppMobileAuthClient.java'
      - 'ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamoAppMobileSyncClient.java'
      - 'ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamoAppMobileOutboxService.java'
      - 'ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamoAppMobileOutboxDirectService.java'
      - 'ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamoAppMobileOutboxDispatcher.java'
      - 'ext-impl/src/ar/com/ospim/autorizaciones/services/ReclamoPrestacionalBajaTransaccionalService.java'
      - 'ext-impl/src/ar/com/ospim/desarrolloAppMobile/beans/ClienteAppMobile.java'
      - 'ext-impl/src/ar/com/ospim/test/ClienteAppMobileLegacySecurityContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalP0ContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalP1CleanupContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalEditorContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalTabGuardContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoAppMobileSyncContractTest.java'
      - 'ext-impl/src/ar/com/ospim/test/ReclamoAppMobileOutboxContractTest.java'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.jsp'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_p0_patch.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_editor_patch.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/view_reclamo_tab_guard.js'
      - 'ext-web/docroot/html/portlet/autorizaciones/reclamos_prestacionales/datos_edicion_prestacion.jsp'
      - '.github/workflows/reclamo-prestacional-p0-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile contracts
        run: |
          rm -rf /tmp/rp-contracts
          mkdir -p /tmp/rp-contracts
          javac -encoding UTF-8 \
            -d /tmp/rp-contracts \
            ext-impl/src/ar/com/ospim/test/ClienteAppMobileLegacySecurityContractTest.java \
            ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalP0ContractTest.java \
            ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalP1CleanupContractTest.java \
            ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalEditorContractTest.java \
            ext-impl/src/ar/com/ospim/test/ReclamoPrestacionalTabGuardContractTest.java \
            ext-impl/src/ar/com/ospim/test/ReclamoAppMobileSyncContractTest.java \
            ext-impl/src/ar/com/ospim/test/ReclamoAppMobileOutboxContractTest.java

      - name: Verify embedded secrets
        run: bash scripts/reclamos/verificar_secretos_appmobile.sh

      - name: Run legacy AppMobile security contract
        run: |
          java -cp /tmp/rp-contracts \
            ar.com.ospim.test.ClienteAppMobileLegacySecurityContractTest

      - name: Run P0 contract
        run: |
          java -cp /tmp/rp-contracts \
            ar.com.ospim.test.ReclamoPrestacionalP0ContractTest

      - name: Run P1 cleanup contract
        run: |
          java -cp /tmp/rp-contracts \
            ar.com.ospim.test.ReclamoPrestacionalP1CleanupContractTest

      - name: Run editor contract
        run: |
          java -cp /tmp/rp-contracts \
            ar.com.ospim.test.ReclamoPrestacionalEditorContractTest

      - name: Run tab guard contract
        run: |
          java -cp /tmp/rp-contracts \
            ar.com.ospim.test.ReclamoPrestacionalTabGuardContractTest

      - name: Run AppMobile synchronization contract
        run: |
          java -cp /tmp/rp-contracts \
            ar.com.ospim.test.ReclamoAppMobileSyncContractTest

      - name: Run AppMobile outbox contract
        run: |
          java -cp /tmp/rp-contracts \
            ar.com.ospim.test.ReclamoAppMobileOutboxContractTest
