name: Aplicar filtro fecha alta Compras

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aplicar-filtro-fecha-alta-compras.yml"
      - ".github/scripts/aplicar_filtro_fecha_alta_compras.py.gz"

permissions:
  contents: write

concurrency:
  group: aplicar-filtro-fecha-alta-compras
  cancel-in-progress: false

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar transformacion focalizada
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .github/scripts/aplicar_filtro_fecha_alta_compras.py.gz \
            > .github/scripts/aplicar_filtro_fecha_alta_compras.py
          python3 .github/scripts/aplicar_filtro_fecha_alta_compras.py
          rm -f .github/scripts/aplicar_filtro_fecha_alta_compras.py

      - name: Verificar diff funcional
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          cat > /tmp/expected-functional-files.txt <<'EOF'
          docs/sql/20260903_filtrar_requerimientos_compras_por_fecha_alta.sql
          ext-impl/src/ar/com/ospim/compras/requerimientos/action/BuscarRequerimientosComprasAction.java
          ext-impl/src/ar/com/ospim/compras/requerimientos/beans/RequerimientoCompraFiltro.java
          ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceImpl.java
          ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceUtil.java
          ext-impl/src/ar/com/ospim/compras/sql/compras_schema.sql
          ext-web/docroot/html/portlet/compras/requerimientos/requerimiento_compra_listado.jsp
          EOF

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual-functional-files.txt
          diff -u /tmp/expected-functional-files.txt /tmp/actual-functional-files.txt

          grep -Fq 'buscar_requerimientos(?,?,?,?,?,?,?,?,?,?)' \
            ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceImpl.java
          grep -Fq 'formato.setLenient(false);' \
            ext-impl/src/ar/com/ospim/compras/requerimientos/action/BuscarRequerimientosComprasAction.java
          grep -Fq 'p_fecha_alta_desde DATE' \
            ext-impl/src/ar/com/ospim/compras/sql/compras_schema.sql
          grep -Fq "INTERVAL '1 day'" \
            ext-impl/src/ar/com/ospim/compras/sql/compras_schema.sql
          grep -Fq 'dayParam="fechaAltaDesdeDia"' \
            ext-web/docroot/html/portlet/compras/requerimientos/requerimiento_compra_listado.jsp

          git diff --stat
          git diff -- \
            docs/sql/20260903_filtrar_requerimientos_compras_por_fecha_alta.sql \
            ext-impl/src/ar/com/ospim/compras/requerimientos/action/BuscarRequerimientosComprasAction.java \
            ext-impl/src/ar/com/ospim/compras/requerimientos/beans/RequerimientoCompraFiltro.java \
            ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceImpl.java \
            ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceUtil.java \
            ext-impl/src/ar/com/ospim/compras/sql/compras_schema.sql \
            ext-web/docroot/html/portlet/compras/requerimientos/requerimiento_compra_listado.jsp

      - name: Generar respaldo verificable del cambio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/filtro-fecha-alta-compras
          git diff --binary > \
            /tmp/filtro-fecha-alta-compras/filtro-fecha-alta-compras.patch

      - name: Publicar respaldo del diff
        uses: actions/upload-artifact@v4
        with:
          name: filtro-fecha-alta-compras
          path: /tmp/filtro-fecha-alta-compras/filtro-fecha-alta-compras.patch
          if-no-files-found: error
          retention-days: 7

      - name: Crear commit funcional y publicar main
        shell: bash
        run: |
          set -euo pipefail

          git rm -- \
            .github/workflows/aplicar-filtro-fecha-alta-compras.yml \
            .github/scripts/aplicar_filtro_fecha_alta_compras.py.gz
          rm -f .github/scripts/aplicar_filtro_fecha_alta_compras.py

          git add -- \
            docs/sql/20260903_filtrar_requerimientos_compras_por_fecha_alta.sql \
            ext-impl/src/ar/com/ospim/compras/requerimientos/action/BuscarRequerimientosComprasAction.java \
            ext-impl/src/ar/com/ospim/compras/requerimientos/beans/RequerimientoCompraFiltro.java \
            ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceImpl.java \
            ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceUtil.java \
            ext-impl/src/ar/com/ospim/compras/sql/compras_schema.sql \
            ext-web/docroot/html/portlet/compras/requerimientos/requerimiento_compra_listado.jsp

          git diff --cached --check

          cat > /tmp/expected-staged-files.txt <<'EOF'
          .github/scripts/aplicar_filtro_fecha_alta_compras.py.gz
          .github/workflows/aplicar-filtro-fecha-alta-compras.yml
          docs/sql/20260903_filtrar_requerimientos_compras_por_fecha_alta.sql
          ext-impl/src/ar/com/ospim/compras/requerimientos/action/BuscarRequerimientosComprasAction.java
          ext-impl/src/ar/com/ospim/compras/requerimientos/beans/RequerimientoCompraFiltro.java
          ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceImpl.java
          ext-impl/src/ar/com/ospim/compras/requerimientos/service/BusquedaRequerimientoCompraServiceUtil.java
          ext-impl/src/ar/com/ospim/compras/sql/compras_schema.sql
          ext-web/docroot/html/portlet/compras/requerimientos/requerimiento_compra_listado.jsp
          EOF

          git diff --cached --name-only | sort > /tmp/actual-staged-files.txt
          diff -u /tmp/expected-staged-files.txt /tmp/actual-staged-files.txt

          git config user.name "JerePrograma"
          git config user.email "jeremias.j.riv@gmail.com"

          git commit \
            -m "feat(compras): filtrar requerimientos por fecha de alta" \
            -m "Agrega rango opcional desde/hasta en la vista legacy, valida las fechas en Action y ServiceUtil, extiende el CALL JDBC y conserva la firma PostgreSQL anterior mediante un wrapper compatible."

          git push origin HEAD:main
