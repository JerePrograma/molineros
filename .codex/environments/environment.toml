# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "devmolineros"

[setup]
script = ""

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"

Write-Host "Preparando entorno legacy Molineros"
Write-Host "Directorio actual: $(Get-Location)"
Write-Host ""

$requiredVariables = @(
    "JAVA_HOME",
    "ANT_HOME",
    "CATALINA_HOME"
)

foreach ($variable in $requiredVariables) {
    $value = [Environment]::GetEnvironmentVariable($variable)

    if ([string]::IsNullOrWhiteSpace($value)) {
        throw "$variable no esta definido en el entorno Codex."
    }
}

$javaExe = Join-Path $env:JAVA_HOME "bin\java.exe"
$javacExe = Join-Path $env:JAVA_HOME "bin\javac.exe"
$antBat = Join-Path $env:ANT_HOME "bin\ant.bat"
$catalinaBat = Join-Path $env:CATALINA_HOME "bin\catalina.bat"

$requiredFiles = @(
    $javaExe,
    $javacExe,
    $antBat,
    $catalinaBat
)

foreach ($file in $requiredFiles) {
    if (-not (Test-Path -LiteralPath $file)) {
        throw "No existe: $file"
    }
}

if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
    throw "Git no esta disponible en PATH."
}

if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
    throw "Node.js no esta disponible en PATH. Ponytail necesita Node para sus hooks."
}

$env:Path =
        "$env:JAVA_HOME\bin;" +
        "$env:ANT_HOME\bin;" +
        "$env:CATALINA_HOME\bin;" +
        $env:Path

git status --short --branch

if ($LASTEXITCODE -ne 0) {
    throw "El directorio actual no es un repositorio Git valido."
}

Write-Host ""
Write-Host "Java"
& $javaExe -version

Write-Host ""
Write-Host "Javac"
& $javacExe -version

Write-Host ""
Write-Host "Ant"
& $antBat -version

Write-Host ""
Write-Host "Tomcat"
& $catalinaBat version

Write-Host ""
Write-Host "Node"
node --version

Write-Host ""
Write-Host "Ponytail mode: $env:PONYTAIL_DEFAULT_MODE"
Write-Host "Entorno Molineros validado correctamente."
'''

[cleanup]
script = ""

[cleanup.win32]
script = "Write-Host \"Molineros no requiere limpieza automatica del worktree.\""

[[actions]]
name = "Verificar entorno legacy"
icon = "tool"
command = '''
$ErrorActionPreference = "Stop"

$javaExe = Join-Path $env:JAVA_HOME "bin\java.exe"
$javacExe = Join-Path $env:JAVA_HOME "bin\javac.exe"
$antBat = Join-Path $env:ANT_HOME "bin\ant.bat"
$catalinaBat = Join-Path $env:CATALINA_HOME "bin\catalina.bat"

$requiredFiles = @(
    $javaExe,
    $javacExe,
    $antBat,
    $catalinaBat
)

foreach ($file in $requiredFiles) {
    if (-not (Test-Path -LiteralPath $file)) {
        throw "No existe: $file"
    }
}

Write-Host "JAVA_HOME=$env:JAVA_HOME"
Write-Host "ANT_HOME=$env:ANT_HOME"
Write-Host "CATALINA_HOME=$env:CATALINA_HOME"
Write-Host ""

& $javaExe -version
& $javacExe -version
& $antBat -version
& $catalinaBat version
'''

[[actions]]
name = "Estado Git"
icon = "tool"
command = "git status --short --branch"

[[actions]]
name = "Revisar cambios"
icon = "tool"
command = '''
$ErrorActionPreference = "Stop"

git diff --check

if ($LASTEXITCODE -ne 0) {
    throw "git diff --check encontro errores."
}

Write-Host ""
Write-Host "Resumen:"
git diff --stat

Write-Host ""
Write-Host "Cambios:"
git diff
'''
